openapi: 3.0.3
info:
  title: TPA PPME Den Haag API
  description: |
    API contract for the TPA PPME Den Haag progress-tracking PWA.

    Two API surfaces:
    1. **PostgREST** (auto-generated by Supabase from the PostgreSQL schema) — all CRUD,
       enforced by Row Level Security. Base URL: `https://{project}.supabase.co/rest/v1`
    2. **Netlify Functions** (custom logic) — notifications, streaks, push subscriptions.
       Base URL: `https://tpa.ppmedenhaag.nl/.netlify/functions`

    All requests require a Supabase JWT (from Google OAuth via Supabase Auth) in the
    `Authorization: Bearer {jwt}` header plus the `apikey` header (anon key).
    Authorization is enforced by RLS at the database layer; the policies referenced
    below are defined in `migrations/003_rls_policies.sql`.
  version: 1.0.0-draft
  contact:
    name: PPME Den Haag IT Team

servers:
  - url: https://{project}.supabase.co/rest/v1
    description: Supabase PostgREST (production, Frankfurt eu-central-1)
    variables:
      project:
        default: TBD
  - url: https://tpa.ppmedenhaag.nl/.netlify/functions
    description: Netlify Functions (custom logic)

security:
  - bearerAuth: []
    apiKey: []

tags:
  - name: students
  - name: attendance
  - name: assignments
  - name: yanbua
  - name: quran
  - name: murajaah
  - name: reports
    description: Year-end curriculum reports
  - name: functions
    description: Custom Netlify Functions
  - name: admin
    description: >-
      Full read and write access to every feature on every class (TAD ADR-014,
      which reverses ADR-012's "enrollment/setup only" scope — that restriction
      was always application-layer, never in RLS). Admin is the one grant here
      that comes from `users.role` rather than from a relationship; every other
      rule below is relationship-based, so one person may hold several at once
      (ADR-019).

paths:
  # ───────────────────────── PostgREST ─────────────────────────
  /students:
    get:
      tags: [students]
      summary: List students visible to the caller
      description: |
        RLS: a guardian sees the children they hold an active `student_guardians`
        link to; Tutor sees students in assigned classes; Student (16+ self-login)
        sees only their own record; Admin sees all.

        Those are four separate permissive policies and Postgres ORs them, so an
        **unfiltered** call returns the union of every one that applies to the
        caller — for a person who is both a tutor and a parent that is their whole
        class alongside their own child, and for an admin it is the entire TPA.
        A client that means "my children" calls **`POST /rpc/fn_my_family_students`**
        instead (TAD ADR-040): a `security definer` function that returns the
        caller's children plus their own 16+ record, each row flagged
        `is_guardian` / `is_self`. It replaced the former
        `or=(parent_id.eq.{uuid},user_id.eq.{uuid})` filter — `students.parent_id`
        no longer exists. See TAD ADR-019, ADR-040.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: class_id
          in: query
          schema: { type: string }
          description: 'PostgREST filter, e.g. `eq.{uuid}`'
      responses:
        '200':
          description: Filtered list of students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Student' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /classes:
    get:
      tags: [students]
      summary: List classes visible to the caller
      description: |
        RLS (`classes_read`, one policy with four OR-ed branches): a class is
        visible to its tutors, to an admin, to the parents of the children in it,
        and to a 16+ student enrolled in it.

        The same union caveat as `/students` applies, and bites the same person:
        a tutor whose own child attends another class sees that class here too.
        A client that means "classes I may record against" must filter
        `tutor_ids=cs.{uuid}` — an admin is the exception, being in no class's
        `tutor_ids` and entitled to all of them (TAD ADR-014, ADR-019).
      parameters:
        - $ref: '#/components/parameters/select'
        - name: tutor_ids
          in: query
          schema: { type: string }
          description: >-
            PostgREST array containment, e.g. `cs.{uuid}` — the same test
            `fn_my_classes()` makes with `auth.uid() = any (tutor_ids)`, and it
            uses the GIN index on the column.
      responses:
        '200':
          description: Filtered list of classes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Class' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attendance:
    get:
      tags: [attendance]
      summary: Get attendance records
      description: 'RLS: Tutor — own classes; Parent — own children; Student 16+ — self.'
      parameters:
        - $ref: '#/components/parameters/select'
        - name: session_id
          in: query
          schema: { type: string }
        - name: student_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Attendance rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [attendance]
      summary: Record attendance (Tutor only, own classes)
      description: |
        Bulk insert supported (array body). The client does **not** call any
        notification endpoint: a database trigger (migration 009) fires
        `/.netlify/functions/notify-absence` for each row that transitions
        *into* status `absent`. Writes from the tutor screen and the admin
        screen therefore both notify, and re-saving a roster whose rows are
        already `absent` notifies nobody a second time. See TAD ADR-015(c).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AttendanceInsert'
                - type: array
                  items: { $ref: '#/components/schemas/AttendanceInsert' }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /tutor_attendance:
    get:
      tags: [attendance]
      summary: Get tutor attendance records
      description: |
        Per-session attendance for the tutors of a class (TAD ADR-041).
        RLS: Admin — any class; Tutor — sessions in own classes.
        **Parents and 16+ students have no policy on this table and get an
        empty array** — tutor attendance is staff data with no family
        stake. Names for the UI come from `POST /rpc/fn_class_tutors`.
        The admin review screen (`/admin/tutor-attendance`, ADR-041(g))
        reads this filtered by `tutor_id` and joins the session date +
        group name from `/sessions?select=date,classes(name)`.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: session_id
          in: query
          schema: { type: string }
        - name: tutor_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tutor attendance rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TutorAttendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [attendance]
      summary: Record tutor attendance (Tutor — own classes; Admin — any)
      description: |
        Bulk upsert supported (array body), `on_conflict=session_id,tutor_id`
        — the register replays whole from the offline queue, so re-sending
        an already-stored row is a no-op. Unlike `/attendance` this fires
        **no** notification: there is no tutor-absence push (ADR-041(b)).
        The subject `tutor_id` must be named in the session's class
        `tutor_ids` or the row is rejected by RLS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TutorAttendanceInsert'
                - type: array
                  items: { $ref: '#/components/schemas/TutorAttendanceInsert' }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /assignments:
    get:
      tags: [assignments]
      summary: Get class assignments
      description: "RLS: Tutor — own classes; Parent — own children's classes; Student 16+ — own class."
      parameters:
        - $ref: '#/components/parameters/select'
        - name: class_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [assignments]
      summary: Create assignment (Tutor only, own classes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInsert' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /assignment_status:
    get:
      tags: [assignments]
      summary: Get per-student homework status
      description: |
        RLS: Tutor — students in own classes; Parent — own children; Student
        16+ — self. Not filterable by class_id directly (assignment_status
        has no class_id column) — callers join client-side against
        `/assignments` by `assignment_id`, the same pattern as
        `/attendance` joining `/sessions` by date.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: assignment_id
          in: query
          schema: { type: string }
        - name: student_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Status rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignmentStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [assignments]
      summary: Create per-student status rows for a new assignment (Tutor only)
      description: |
        One row per assigned student (whole class or a selected subset),
        `status` defaulting to `pending` if omitted. Called once per
        recipient right after the `POST /assignments` that creates the
        parent row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AssignmentStatusInsert'
                - type: array
                  items: { $ref: '#/components/schemas/AssignmentStatusInsert' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }
    patch:
      tags: [assignments]
      summary: Update homework status (Tutor only)
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: 'e.g. `eq.{uuid}`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/AssignmentStatusEnum' }
                notes: { type: string }
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /yanbua_progress:
    get:
      tags: [yanbua]
      summary: Get Yanbu'a progress history
      description: 'RLS: Tutor — own students; Parent — own children; Student 16+ — self.'
      parameters:
        - $ref: '#/components/parameters/select'
        - name: student_id
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, example: recorded_at.desc }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Progress rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/YanbuaProgress' }
    post:
      tags: [yanbua]
      summary: Record Yanbu'a progress (Tutor only)
      description: |
        A DB webhook triggers `/.netlify/functions/notify-milestone` for
        **every** entry (migration 010); that Function applies
        `src/lib/yanbua.ts#isJilidComplete` — the same module the Yanbu'a
        screen uses — and sends a celebration push only when the entry
        completes a jilid. The trigger is unselective on purpose: a filter in
        SQL would be a second copy of the completion rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/YanbuaProgressInsert' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /quran_progress:
    get:
      tags: [quran]
      summary: Get Quran tilawah history
      description: |
        `students.current_surah`/`current_ayah` are never written by this
        feature — a client derives current position from the newest row
        here instead (`order=recorded_at.desc&limit=1`), the same pattern
        `/yanbua_progress` uses for jilid/page.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: student_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Progress rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuranProgress' }
    post:
      tags: [quran]
      summary: Record Quran progress (Tutor only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuranProgressInsert' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /murajaah_assignments:
    get:
      tags: [murajaah]
      summary: Get Murajaah assignments
      description: 'RLS: Tutor + Parent (+ Student 16+ read-only).'
      parameters:
        - $ref: '#/components/parameters/select'
        - name: student_id
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: string, example: is.true }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MurajaahAssignment' }
    post:
      tags: [murajaah]
      summary: Assign Murajaah target (Tutor only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MurajaahAssignmentInsert' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }
    patch:
      tags: [murajaah]
      summary: Mark a target memorized, or assign/reassign a tutor (Tutor only)
      description: |
        PRD FR-005/FR-007's "Tutor tests memorization, if Hafal Lancar mark
        as Memorized" resolves entirely through this endpoint: flipping
        `active` to `false` is the tutor's only lever, since there is no
        RLS write path from a tutor into `murajaah_log` (parent-only insert)
        and this table has no quality/assessment column. The tutor's live
        TPA assessment result is applied as an action here, not persisted
        as a separate record.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: 'e.g. `eq.{uuid}`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /murajaah_log:
    get:
      tags: [murajaah]
      summary: Get practice confirmation log
      parameters:
        - $ref: '#/components/parameters/select'
        - name: assignment_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Log rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MurajaahLog' }
    post:
      tags: [murajaah]
      summary: Confirm daily practice (Parent only, own children)
      description: |
        One confirmation per assignment per calendar day (unique constraint).
        There is no streak column to send: `murajaah_log.streak_count` and its
        trigger were dropped in migration 011. The streak is derived from the
        log at read time, in the period the target's `frequency` asks for, by
        `computeStreak` in `src/lib/murajaah.ts` (TAD ADR-016).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MurajaahLogInsert' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }
        '409': { description: Already confirmed today (unique violation) }

  /year_end_reports:
    get:
      tags: [reports]
      summary: Get year-end reports for a student
      description: |
        RLS: Tutor sees own students' reports at any status (including drafts).
        Parent/Student 16+ see only `status=published` rows for their
        child/self — drafts are invisible by construction, not app-layer filtering.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: student_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
          description: 'e.g. `eq.published`'
        - name: academic_year
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/YearEndReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [reports]
      summary: Edit narrative/grades (Tutor only, own students, draft or published)
      description: |
        Editing a published report does not itself regenerate the PDF — the
        client should follow up with `/publish-report` to trigger regeneration
        (FR-006), since PDF rendering runs server-side under the service role.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/YearEndReportUpdate' }
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /rpc/fn_class_tutors:
    post:
      tags: [attendance]
      summary: The tutors named in a class's tutor_ids (id + name)
      description: |
        Added in migration 022 (TAD ADR-041). `security definer`. Returns
        `{ user_id, full_name }` for every id in `classes.tutor_ids` of
        `p_class`, ordered by name — the labels for the attendance
        register's tutor section and the admin review timeline. The
        entitlement check (admin, or a tutor of `p_class`) is folded into
        the `WHERE`, so a caller who is neither gets an empty array, not a
        403 — the `fn_student_guardians` pattern. Needed because
        `users_self_read` does not expose other users to a tutor. A
        `tutor_ids` member who is also a student enrolled in `p_class` (a
        student-assistant) is omitted — their attendance is taken on the
        student roster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_class]
              properties:
                p_class: { type: string, format: uuid }
      responses:
        '200':
          description: The class's tutors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id: { type: string, format: uuid }
                    full_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rpc/fn_my_family_students:
    post:
      tags: [students]
      summary: The caller's own children (and their own 16+ record)
      description: |
        Added in migration 021 (TAD ADR-040). `security definer`. Returns one
        row per student the caller is an **active** `student_guardians`
        guardian of, plus their own row if `students.user_id = auth.uid()`.
        Each row carries `is_guardian` and `is_self` so the app can tell the
        two links apart. Replaces the former
        `GET /students?or=(parent_id.eq…,user_id.eq…)` filter — there is no
        user-influenced value spliced into a filter expression any more.
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        '200':
          description: The caller's family students
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    full_name: { type: string }
                    user_id: { type: string, format: uuid, nullable: true }
                    is_guardian: { type: boolean }
                    is_self: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rpc/fn_my_family_flags:
    post:
      tags: [students]
      summary: Whether the caller is a guardian / a 16+ self-login student
      description: |
        Added in migration 021 (TAD ADR-040). `security definer`. Returns a
        single row `{ is_parent, is_self }` — the same two booleans
        `fn_my_family_students` computes, but without loading any child's name.
        This is the data-minimising query `/.netlify/functions/push-subscribe`
        and the notification settings screen use to decide whether an account
        may receive notifications (TAD ADR-022(c)).
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        '200':
          description: One row of two booleans
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    is_parent: { type: boolean }
                    is_self: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rpc/fn_student_guardians:
    post:
      tags: [students]
      summary: A student's active guardians, with names (tutor of the class, or admin)
      description: |
        Added in migration 021 (TAD ADR-040). `security definer`, with the
        caller check folded into its `WHERE` (the `fn_pending_registrations`
        pattern): returns the active guardians of `p_student` — `user_id`,
        `full_name`, `email`, `relation` — to an admin or to a tutor of that
        student's class, and an **empty array** to anyone else rather than a
        403. `users_self_read` does not expose other users' rows to a tutor,
        which is why the admin/tutor enrolment UI reads guardian names through
        this function.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_student]
              properties:
                p_student: { type: string, format: uuid }
      responses:
        '200':
          description: The student's active guardians (empty for a non-entitled caller)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id: { type: string, format: uuid }
                    full_name: { type: string }
                    email: { type: string }
                    relation: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rpc/fn_admin_save_student:
    post:
      tags: [admin]
      summary: Create or update a student and its guardian set in one transaction (Admin only)
      description: |
        Added in migration 021 (TAD ADR-040). `security definer`; raises
        `42501` for a non-admin caller and `23514` for an empty `p_guardians`.
        `p_id` null → insert, non-null → update. Writes the `students` row and
        diffs the guardian set — inserting wanted links, setting `unlinked_at`
        on removed ones (never deleting, so the audit trail survives) — in a
        single transaction, so a student can never momentarily exist with no
        guardian. Replaces the client-side `createStudent` / `updateStudent`
        pair. Returns the student id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_full_name, p_dob, p_guardians]
              properties:
                p_full_name: { type: string }
                p_dob: { type: string, format: date }
                p_guardians:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [user_id]
                    properties:
                      user_id: { type: string, format: uuid }
                      relation: { type: string, nullable: true }
                p_id: { type: string, format: uuid, nullable: true }
                p_class_id: { type: string, format: uuid, nullable: true }
                p_user_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: The saved student's id
          content:
            application/json:
              schema: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /student_guardians:
    get:
      tags: [students, admin]
      summary: Guardian links visible to the caller
      description: |
        Added in migration 021 (TAD ADR-040). RLS: a guardian reads their own
        **active** links; a tutor reads the active links of students in their
        classes; an admin reads all, including `unlinked_at` rows. Writes are
        admin-only and go through `POST /rpc/fn_admin_save_student`, not this
        path.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: student_id
          in: query
          schema: { type: string }
          description: 'PostgREST filter, e.g. `eq.{uuid}`'
      responses:
        '200':
          description: Filtered list of guardian links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentGuardian' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /user_role_changes:
    get:
      tags: [admin]
      summary: Role-change audit log (Admin only)
      description: |
        Added in migration 023 (TAD ADR-042). One row per role change
        applied through `POST /rpc/fn_admin_update_user`: `user_id`,
        `old_role`, `new_role`, `changed_by`, `changed_at`. RLS is
        admin-only `ALL` (`user_role_changes_admin_all`) — a tutor,
        parent or anon caller gets an empty array. Rows are written only
        by the RPC (`security definer`); there is no client insert path.
        Not surfaced in the app yet.
      parameters:
        - $ref: '#/components/parameters/select'
        - name: user_id
          in: query
          schema: { type: string }
          description: 'PostgREST filter, e.g. `eq.{uuid}`'
        - name: order
          in: query
          schema: { type: string }
          description: 'e.g. `changed_at.desc`'
      responses:
        '200':
          description: Role-change rows (empty array for non-admin callers)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserRoleChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rpc/fn_admin_user_role_impact:
    post:
      tags: [admin]
      summary: Consequences of a prospective role change, for the confirm dialog (Admin only)
      description: |
        Added in migration 023 (TAD ADR-042). `security definer`, read-only.
        Returns one row; every field is gated on `fn_is_admin()`, so a
        non-admin caller gets an empty summary (`fn_pending_registrations`
        pattern) rather than a 403. `tutor_groups` — group names a
        tutor→non-tutor change would unassign the user from (they are
        removed on apply). `guardian_children` — children a parent→non-parent
        change leaves them guarding (links are **not** severed). `linked_student`
        — the santri a student→non-student change leaves the account a login
        for (link **not** severed). `would_block` — `self`, `last_admin`, or
        `null`; when set, the UI pre-disables Save and explains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user, p_new_role]
              properties:
                p_user: { type: string, format: uuid }
                p_new_role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: A single impact-summary row
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  type: object
                  properties:
                    tutor_groups: { type: array, items: { type: string } }
                    guardian_children: { type: array, items: { type: string } }
                    linked_student: { type: string, nullable: true }
                    would_block:
                      type: string
                      nullable: true
                      enum: [self, last_admin]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rpc/fn_admin_update_user:
    post:
      tags: [admin]
      summary: Set a user's display name and role (Admin only)
      description: |
        Added in migration 023 (TAD ADR-042). `security definer`; raises
        `42501` for a non-admin caller. Trims and length-checks `p_full_name`
        (1–120 chars → `22023` otherwise). When `p_new_role` differs from the
        user's current role it enforces two hard blocks (`P0001`): the last
        remaining admin cannot be demoted, and an admin cannot change their
        own role. On a tutor→non-tutor change it also removes the user from
        every `classes.tutor_ids` in the same transaction, and writes a
        `user_role_changes` row. A name-only change updates the profile and
        writes no audit row. Call `POST /rpc/fn_admin_user_role_impact`
        first to warn the operator. Returns no body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user, p_full_name, p_new_role]
              properties:
                p_user: { type: string, format: uuid }
                p_full_name: { type: string, minLength: 1, maxLength: 120 }
                p_new_role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '204': { description: Applied }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /rpc/fn_pending_registrations:
    post:
      tags: [admin]
      summary: List Google sign-ins with no matching public.users profile yet (Admin only)
      description: |
        Added in migration 008. `security definer` — the only way to read
        `auth.users` (id/email/created_at only, nothing else) from a client
        role, since that schema isn't otherwise PostgREST-exposed. Gated to
        admin-only *inside* the function (`and public.fn_is_admin()` folded
        into its `WHERE` clause) rather than by a 403 — a non-admin caller
        gets an empty array, matching this project's established convention
        (see migration 007's grants) of an empty result over a raw
        permission error. Powers the Registrations admin page's fallback
        path for someone who signed in directly instead of being invited
        via `/invite-user`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Pending sign-ins (empty array for non-admin callers)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    email: { type: string, format: email }
                    created_at: { type: string, format: date-time }
                    full_name: { type: string, nullable: true }
                    description: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /registration_requests:
    description: >-
      Staging table (migration 020, TAD ADR-038) for a signed-in Google
      account with no `public.users` row yet: it lets that user submit their
      own full name plus free-text context for an admin to see when
      approving. RLS: the caller GETs/PATCHes only their own row
      (`id = auth.uid()`), and may POST their own row only while no
      `public.users` row exists for them; admins see and manage every row.
      Submitting does not grant access - approval is still an admin creating
      the `public.users` row, at which point a trigger deletes the request.
    get:
      tags: [auth]
      summary: Get the caller's own registration request
      parameters:
        - $ref: '#/components/parameters/select'
        - name: id
          in: query
          schema: { type: string }
          description: 'PostgREST filter `eq.{uuid}` - must be the caller''s own id'
      responses:
        '200':
          description: Zero or one row
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegistrationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [auth]
      summary: Submit or revise the caller's registration request (upsert on id)
      description: >-
        `Prefer: resolution=merge-duplicates`. The client sends its own
        `id`; RLS rejects any other, and rejects the insert once the caller
        is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequestWrite' }
      responses:
        '201': { description: Created }
        '200': { description: Updated (merge-duplicates) }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }
    patch:
      tags: [auth]
      summary: Revise the caller's registration request
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: 'Must be `eq.{caller uuid}`'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequestWrite' }
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/ForbiddenRLS' }

  /generate-year-end-drafts:
    post:
      tags: [functions, reports]
      summary: Admin-triggered bulk creation of draft reports
      description: |
        **Admin only**, verified inside the Function against the caller's
        JWT + `public.users.role` — never trusted from the client.

        Computes the attendance stats snapshot for the given academic year
        (1 Aug – 31 Jul window; `late` counts as attended, matching the
        rate shown on the attendance screens) and inserts one draft
        `year_end_reports` row per enrolled student, authored by the first
        tutor of that student's class.

        Idempotent: students who already have a report for that year are
        skipped (unique constraint on `(student_id, academic_year)`), so
        re-running is a safe no-op. Students with no class, or whose class
        has no tutor assigned, cannot be given a report at all
        (`tutor_id` is NOT NULL) and come back as `skipped_no_tutor`.

        The response is three counts. Under ADR-013 that was a privacy
        boundary — admin could trigger generation but never see what the
        reports said. TAD ADR-014 supersedes that half: admin now reads
        and edits every report, and this trigger lives on the admin's own
        Reports screen rather than a separate counts-only page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_year]
              properties:
                academic_year: { type: string, example: '2025/2026' }
                class_id:
                  type: string
                  format: uuid
                  description: Optional — scope to a single class; omit for all classes
      responses:
        '200':
          description: Drafts created
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_count: { type: integer }
                  skipped_existing:
                    type: integer
                    description: Already had a report for this academic year
                  skipped_no_tutor:
                    type: integer
                    description: >-
                      No class, or a class with no tutor assigned — blocked on
                      enrollment work rather than already done
        '400': { description: Missing or malformed academic_year (must be two consecutive years) }
        '403': { description: Caller is not an admin }

  /publish-report:
    post:
      tags: [functions, reports]
      summary: Publish a draft, or regenerate PDF for a published report after edits
      description: |
        Verifies the caller is the **authoring tutor** for this report —
        not admin, and not a co-tutor on the same class. This mirrors
        `yer_tutor_rw`'s WITH CHECK (`tutor_id = auth.uid()`): a co-tutor
        who cannot edit a report through PostgREST cannot publish it
        either. See TAD ADR-013.

        This is the one report boundary TAD ADR-014 deliberately did not
        move: admin became a super admin over every other operational
        surface, including editing this report's narrative and grades,
        and still gets a 403 here. Publishing is what makes a report
        visible to a family. The consequence — an admin edit to an
        already-published report leaves the stored PDF stale until the
        authoring tutor calls this again — is surfaced to the admin in
        the report editor rather than hidden.

        Renders the PDF via pdfkit (ADR-011), uploads it to the private
        `reports` Storage bucket, and only then flips
        `status: draft → published` and sets `pdf_path`/`published_at`.
        The status flip is deliberately last: a failed render or upload
        leaves the row exactly as it was, so there is no stuck
        intermediate state and a retry needs no cleanup.

        Requires a non-empty `narrative` (PRD 6.8 AC-003 — the narrative is
        always tutor-authored); subject grades stay optional, since a
        student who has not started memorizing yet should not need a
        fabricated Murajaah grade to get a report.

        Also the FR-006 path: re-publishing an already-published report
        after an edit overwrites the same Storage object (the path is
        deterministic per student + academic year) and preserves the
        original `published_at` — that is when the family first received
        the report; `updated_at` tracks the corrections.

        **No notification is sent.** FR-007's report-ready push is deferred
        with the rest of the notification pipeline, which does not exist
        yet for any feature in this project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id]
              properties:
                report_id: { type: string, format: uuid }
      responses:
        '200':
          description: Published (or re-published) successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id: { type: string, format: uuid }
                  pdf_path: { type: string }
                  published_at: { type: string, format: date-time }
        '400': { description: report_id missing, or the report has no narrative yet }
        '403': { description: Caller is not the authoring tutor }
        '404': { description: No such report }
        '500': { description: PDF generation or upload failed — status not changed, safe to retry }

  /report-pdf:
    get:
      tags: [functions, reports]
      summary: Get a short-lived signed URL for a report's PDF
      description: |
        Checks the caller's authorization against the same rule as the
        `year_end_reports` RLS policy (admin: any report, any status;
        tutor: own students, any status; parent/student: own child/self,
        published only) before minting a signed URL — this check is
        load-bearing since signed URLs bypass RLS and the `reports`
        bucket has no client-facing read policy at all, making this
        Function the only gate in front of the file.

        Admin was denied outright under ADR-012/ADR-013 even though RLS
        granted it ALL. TAD ADR-014 supersedes that: admin reads and
        edits report content in the app, so withholding the PDF of a
        report it can already read in full protected nothing.

        A caller who is not authorized and a report that does not exist
        are deliberately indistinguishable from the outside.
      parameters:
        - name: report_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expires_in: { type: integer, description: 'Seconds — 300' }
        '400': { description: report_id missing }
        '403': { description: Caller not authorized to view this report }
        '404': { description: No such report, or no PDF generated yet (report still in draft) }

  # ───────────────────── Netlify Functions ─────────────────────
  /notify-absence:
    post:
      tags: [functions]
      summary: Send absence push notification to a parent (BUILT)
      description: |
        Invoked by the Supabase database webhook (migration 009) when an
        attendance row transitions into status `absent` — on INSERT, or on
        UPDATE from any other status. Not intended for, and not usable by,
        direct client calls.

        **Authentication is of the channel, not a caller** — a webhook has no
        signed-in user, so `callerAuth.ts` does not apply. The request must
        carry `x-webhook-secret` matching Netlify's `NOTIFY_WEBHOOK_SECRET`,
        compared in constant time. Missing configuration fails closed (500),
        never open. See TAD ADR-015(d).

        **Only `record.id` is read.** The Function re-reads the attendance row
        from the database rather than trusting the posted body, and derives the
        recipients from the child's active `student_guardians` links (TAD
        ADR-040) — nothing about who receives a notification comes from the
        request. The trigger therefore sends only the id, which also keeps the
        absence `reason` (potential health data, DPIA R4/R6) inside Postgres
        entirely.

        Sends one push per active guardian of the child, each in that guardian's
        own `users.locale`, containing the child's first name and the event type
        only. If the push service reports an endpoint gone (404/410), that
        `users.push_sub` is cleared; the response is a 200 no-op.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                type: { type: string, enum: [INSERT, UPDATE] }
                table: { type: string, enum: [attendance] }
                schema: { type: string, enum: [public] }
                record:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Dispatched, or deliberately skipped. Skips are not errors: the row
            may have been corrected or deleted, the parent may have no account
            or no subscription, or the subscription may have expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyResult' }
        '400': { description: Malformed body, or record.id missing }
        '401': { description: Missing or invalid webhook secret }
        '405': { description: Method other than POST }
        '500': { description: NOTIFY_WEBHOOK_SECRET or Supabase env vars not configured (fails closed) }
        '502': { description: The push service rejected the send for a reason other than an expired subscription }

  /notify-milestone:
    post:
      tags: [functions]
      summary: Send milestone celebration push (jilid completed / surah memorized) — BUILT
      description: |
        Invoked by a Supabase database webhook (migration 010), never by a
        client. Serves both celebration rows of the Notification Spec; which
        one is determined by the envelope's `table`, not by a field the caller
        chooses:

        - `yanbua_progress` — the row is re-read and
          `src/lib/yanbua.ts#isJilidComplete` is applied. That rule is
          **imported**, not restated, so the Function and the Yanbu'a screen
          cannot disagree about what completes a jilid. The trigger is
          correspondingly unselective (it fires for every progress entry) —
          any filter in SQL would be a second copy of the rule. Entries that
          are not completions return `sent: 0`.
        - `murajaah_assignments` — fires on `active` going true → false, which
          is exactly the tutor's "Tandai Sudah Hafal" action (checklist §13
          resolved FR-005 that way rather than adding an assessment column),
          so the celebration follows a tutor's judgement rather than inferring
          one.

        Recipients are the child's active guardians, derived from
        `student_guardians` (TAD ADR-040). Neither the jilid number nor the
        surah name is in the payload (DPIA R6) — the builder cannot carry them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table, record]
              properties:
                type: { type: string, enum: [INSERT, UPDATE] }
                table: { type: string, enum: [yanbua_progress, murajaah_assignments] }
                schema: { type: string, enum: [public] }
                record:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Dispatched, or deliberately skipped — the entry was not a jilid
            completion, the target was re-activated, the row is gone, or the
            parent has no subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyResult' }
        '400': { description: Malformed body, record.id missing, or a table this Function does not serve }
        '401': { description: Missing or invalid webhook secret }
        '405': { description: Method other than POST }
        '502': { description: The push service rejected the send }

  /notify-assignment:
    post:
      tags: [functions]
      summary: Send "new homework" push to a whole class — BUILT
      description: |
        Invoked by a database webhook on `public.assignments` (migration 010).
        Not part of the original five-Function list — added because the
        Notification Spec's "New homework assigned" row had no Function
        against it.

        The only sender that fans out across a **class**: the roster is read
        from the database (`students.class_id`), and each student resolves to
        their own parent plus, for a 16+ self-login student, themselves. Sends
        run in parallel up to a fixed concurrency — sequentially a large class
        could run the Function into its timeout with half the families
        notified, and one dead subscription never costs the rest of the class
        their notification.

        The assignment **title is not in the payload** (DPIA R6) and is not
        even sent from the database to the Function.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                type: { type: string, enum: [INSERT] }
                table: { type: string, enum: [assignments] }
                record:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        '200':
          description: Dispatched, or skipped (no such assignment, empty class, nobody subscribed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyResult' }
        '400': { description: Malformed body or record.id missing }
        '401': { description: Missing or invalid webhook secret }
        '405': { description: Method other than POST }
        '502': { description: The push service rejected the send }

  /notify-report-ready:
    post:
      tags: [functions]
      summary: Send "year-end report ready" push (PRD FR-007) — BUILT
      description: |
        Invoked by a database webhook on `year_end_reports.status` reaching
        `published` (migration 010). Deliberately **not** a call inside
        `publish-report`: that flow's whole design is that a failure anywhere
        leaves the report untouched rather than half-published, and adding a
        push-service round trip inside it would put a family's notification in
        the same failure path as their report.

        Fires on the transition into `published` only. A re-publish after a
        correction (FR-006) leaves `status` at `published` and preserves
        `published_at`, so there is no second publish event; and an admin may
        edit a published report *without* the PDF being regenerated
        (ADR-014(e)), which is exactly the case where a second "your report is
        ready" would be announcing an unchanged file.

        Recipients are the parent **and** any linked 16+ student, who can open
        the report themselves.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                type: { type: string, enum: [UPDATE] }
                table: { type: string, enum: [year_end_reports] }
                record:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        '200':
          description: Dispatched, or skipped (report reverted to draft, or nobody subscribed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyResult' }
        '400': { description: Malformed body or record.id missing }
        '401': { description: Missing or invalid webhook secret }
        '405': { description: Method other than POST }
        '502': { description: The push service rejected the send }

  /notifications:
    get:
      tags: [notifications]
      summary: The signed-in user's own notification centre (BUILT, TAD ADR-017)
      description: |
        PostgREST, not a Function. RLS (`notifications_own_read`, migration 012)
        restricts every row to `user_id = auth.uid()`, so this endpoint takes no
        user parameter and cannot be pointed at anyone else — including by an
        admin, who reads no notification addressed to somebody else (ADR-017(d),
        asserted as NC-09 and, for an admin who is also a parent, NC-14). The
        policy is a relationship rather than a role test, which is why ADR-022
        needed no migration here: an admin whose own child attends reads that
        child's notifications and still nobody else's.

        Rows store the **event**, not a rendered sentence: `event` plus a
        `context` object, with the child's name joined through `student_id`.
        The screen builds the text at read time from the i18n copy, so the same
        notification reads in Dutch or Indonesian depending on who is looking,
        and a reworded string reaches rows already written.

        `POST` and `DELETE` are not available to any client role — the write
        grants are revoked in migration 012. Rows are created only by the
        notification Functions under the service-role key, and removed only by
        `prune-notifications`.
      parameters:
        - name: select
          in: query
          schema: { type: string, default: '*, students(full_name)' }
        - name: order
          in: query
          schema: { type: string, default: 'created_at.desc' }
        - name: read_at
          in: query
          description: '`is.null` for the unread count behind the TopNav badge'
          schema: { type: string }
      responses:
        '200':
          description: This user's notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
    patch:
      tags: [notifications]
      summary: Mark notifications read — `read_at` only
      description: |
        The only write any client role can perform on this table, and that is
        enforced by a column-level GRANT rather than by convention: migration
        012 revokes the blanket UPDATE and grants `update (read_at)` alone.
        A recipient cannot rewrite `event` or `context` on their own rows and
        make the app render something that never happened (NC-04, NC-05).
      responses:
        '204': { description: Updated }
        '403': { description: Any column other than read_at }

  /prune-notifications:
    post:
      tags: [functions]
      summary: Notification retention — SCHEDULED (BUILT, TAD ADR-017)
      description: |
        Netlify Scheduled Function, cron `0 * * * *`, acting only in the 03:00
        hour in Europe/Amsterdam. Same authorization shape as the other
        scheduled jobs — it reads nothing from the request.

        Deletes notification-centre rows older than 90 days. This is DPIA risk
        **R5** ("data kept longer than needed"): the notification centre is the
        first table in this project that grows because time passed rather than
        because someone recorded something, so it is the first that needs a
        retention job at all.
      responses:
        '200':
          description: |
            `{ deleted, cutoff, retentionDays }`, or a `skipped` reason outside
            the scheduled hour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
                  cutoff: { type: string, format: date }
                  retentionDays: { type: integer, example: 90 }
                  skipped: { type: string }
        '500': { description: Missing Supabase service credentials, or the job failed }

  /send-murajaah-reminders:
    post:
      tags: [functions]
      summary: Evening Murajaah reminders — SCHEDULED (BUILT, TAD ADR-016)
      description: |
        Netlify Scheduled Function, cron `0 * * * *`, acting only in the 18:00
        hour in Europe/Amsterdam. Invoked by Netlify's scheduler, never by a
        client — and by nothing else in production, where the platform does not
        route HTTP to a scheduled function. Under `netlify dev` it *is* an
        ordinary endpoint (README), which is part of why it is built the way it
        is:

        - It reads **nothing** from the request — no body, no query, no header.
          Every input comes from the database and the clock.
        - Outside its hour it returns before opening a database connection.
        - The response carries counts only, never dedup tags, which would each
          disclose a user id and a student id (ADR-016(e)).
        - Every notification is idempotent per (recipient, event, child, local
          date), so a repeat run sends nothing new.

        Reminds a family only on the last day the target's `frequency` can still
        be met — `daily` every unconfirmed evening, `3x_week` once the days left
        in the week drop to the confirmations still owed, `weekly` on Sunday.
      responses:
        '200':
          description: |
            Delivery counts, or a `skipped` reason when the local-time gate is
            closed or there was nothing to send.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledResult' }
        '500': { description: Missing Supabase service credentials, or the job failed }

  /homework-due-reminders:
    post:
      tags: [functions]
      summary: "\"Homework due tomorrow\" reminders — SCHEDULED (BUILT, TAD ADR-016)"
      description: |
        Netlify Scheduled Function, cron `0 * * * *`, acting only in the 08:00
        hour in Europe/Amsterdam. Same authorization shape as
        `/send-murajaah-reminders` above.

        Covers every class with an assignment due *tomorrow*, and skips any
        student whose `assignment_status` for it is already `completed`.
        Addressed to the parent and, for a 16+ self-login student, to them too.
      responses:
        '200':
          description: Delivery counts, or a `skipped` reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledResult' }
        '500': { description: Missing Supabase service credentials, or the job failed }

  /weekly-progress-digest:
    post:
      tags: [functions]
      summary: Friday weekly digest — SCHEDULED (BUILT, TAD ADR-016)
      description: |
        Netlify Scheduled Function, cron `0 * * * *`, acting only in the 08:00
        hour on a **Friday** in Europe/Amsterdam. Same authorization shape as
        `/send-murajaah-reminders` above.

        Sent to parents of any child with activity in the current Mon–Sun week;
        a week with no attendance, no Yanbu'a or Quran entry and no Murajaah
        confirmation sends nothing, which is the normal case over a school
        holiday.

        The payload says only that a summary is ready. The attendance percentage
        and progress counts the Scheduler table describes are in the app, on the
        dashboard — DPIA R6 does not allow them on a lock screen (ADR-016(g)).
      responses:
        '200':
          description: Delivery counts, or a `skipped` reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledResult' }
        '500': { description: Missing Supabase service credentials, or the job failed }

  /streak-status:
    get:
      tags: [functions]
      summary: Current streak for a Murajaah target — NOT BUILT, and superseded (TAD ADR-016(c))
      description: |
        Kept in this document as a decision, not a plan.

        It would return an integer the caller can already compute. Every screen
        that shows a streak (`FamilyMurajaahView`, `TutorOverviewView`) fetches
        the confirmation history anyway, and runs `computeStreak`
        (`src/lib/murajaah.ts`) over it — the same function
        `send-murajaah-reminders` uses, so the number on the family's screen and
        the number the reminder protects cannot disagree. An endpoint would add a
        network round trip, a second authorization path and a second
        implementation of one rule, and buy nothing.

        If PPME ever wants it, it is a thin wrapper over that function plus the
        `callerAuth` check every other caller-facing Function already has.
      parameters:
        - name: assignment_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Streak info
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment_id: { type: string, format: uuid }
                  current_streak: { type: integer }
                  best_streak: { type: integer }
                  confirmed_today: { type: boolean }
        '403': { description: Caller not authorized for this student (JWT check) }

  /push-subscribe:
    post:
      tags: [functions]
      summary: Store a Web Push subscription for the authenticated user (BUILT)
      description: |
        Writes the caller's own subscription to `users.push_sub`. The user id
        comes from the validated JWT, never from the body, so a caller can only
        ever write their own row.

        `users_self_update` (migration 003) would already permit this through
        PostgREST; it goes through a Function anyway because `push_sub` is
        untyped `jsonb` and the sender will POST to whatever endpoint it holds.
        This is the only validation in front of that column. Only `endpoint`
        and the two keys are persisted — extra fields sent by a client are
        dropped. Rate-limited per caller (checklist §6; see TAD ADR-015 for
        the limiter's honest scope).

        **403 when nothing about a child points at the caller.** A notification
        is always about a child, so a subscription is stored only for an account
        that holds an active `student_guardians` link (TAD ADR-040), or is a
        child's own `students.user_id` for a 16+ santri. The check is
        `fn_my_family_flags()`. A push endpoint is personal data and is not
        collected for an account nothing would ever send to.

        This is a **relationship, not a role** (ADR-022). A tutor or an admin
        whose own child attends the TPA is accepted and is notified about that
        child; a tutor of a class with no child of their own is refused, and
        receives nothing about the children they teach — which is the
        data-minimisation half of ADR-015(a), still standing. ADR-014 made
        admin a super admin over the *screens*, which remains a different
        question. Until ADR-022 this was a check on `users.role`, and it left
        a tutor whose own child attends unable to subscribe at all.

        One subscription per user, not per device: enabling on a second device
        replaces the first (ADR-015(g)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, description: 'Must be https; max 1024 chars' }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '201':
          description: Subscription stored on users.push_sub
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean, enum: [true] }
        '400': { description: Not a valid push subscription (non-HTTPS endpoint, missing keys, oversized values, malformed JSON) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: This account is not linked to any student, so it receives no notifications (ADR-022) }
        '429': { description: Rate limited; `retry-after` header set }
    delete:
      tags: [functions]
      summary: Clear the authenticated user's Web Push subscription (BUILT)
      description: |
        Sets `users.push_sub` to null. Allowed for every role, including the
        ones POST refuses — clearing is never something to refuse. The client
        calls this *before* unsubscribing in the browser, so a failure leaves a
        live browser subscription nothing sends to, rather than a stored
        endpoint that no longer exists.
      responses:
        '200':
          description: Subscription cleared (idempotent — succeeds when there was none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean, enum: [false] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limited; `retry-after` header set }

  /send-reminder:
    post:
      tags: [functions]
      summary: (Scheduled) daily Murajaah reminder dispatcher — NOT BUILT
      description: |
        TAD ADR-015 part 2. The recommendation this stub carried has been
        adopted and recorded as a decision: the cron runs **hourly**
        (`0 * * * *`, UTC — Netlify offers nothing else) and the Function
        returns immediately unless it is 18:00 in `Europe/Amsterdam`, using
        `isAmsterdamHour()` from `netlify/functions/lib/notifications.ts`.
        A fixed UTC hour would be an hour late throughout CEST, which covers
        the whole TPA summer term. The dedup tag is keyed on the family's
        local date, so a repeated run cannot produce a repeated notification.

        Will authenticate its channel the same way `notify-absence` does
        (`webhookAuth.ts`) — a scheduled Function has no caller, and must not
        be usefully invokable by a stranger over HTTP.
      security: []
      responses:
        '200': { description: Reminders dispatched (count in body) }

  /invite-user:
    post:
      tags: [functions, admin]
      summary: Invite a new user by email (Admin only)
      description: |
        Not part of the original 8-Function spec — added to support the
        admin enrollment UI. Verifies the caller is an admin itself (via
        their JWT + a `public.users` lookup under the service-role key)
        rather than trusting the client, since this endpoint necessarily
        runs under `SUPABASE_SERVICE_ROLE_KEY` (bypasses RLS entirely —
        required for `auth.admin.createUser()` and to write `public.users`
        ahead of the invitee's first sign-in). On success, creates both the
        `auth.users` row, confirmed (`email_confirm: true`) and silent —
        no GoTrue email — and the matching `public.users` profile in one
        request. Unlike the `inviteUserByEmail` this endpoint used before
        ADR-026, `createUser` is not idempotent for an already-registered
        email: it errors outright (`email_exists`), which this endpoint
        catches and surfaces as 409, the same status the old idempotency-
        then-unique-constraint path produced.

        **Sends exactly one email**, the Resend invitation/onboarding
        template chosen by the new user's `role`. Until ADR-026 this
        endpoint also triggered GoTrue's own magic-link invite — recorded
        as an open duplication in TAD ADR-018(b) — but sign-in here is
        Google OAuth only (ADR-003), so that link was never consumed by
        anything; ADR-026 drops it by creating the `auth.users` row with
        `createUser` instead of `inviteUserByEmail`.

        The invitation email can never fail this request. It is sent after the
        profile insert, `sendEmail` never throws, and the outcome is reported
        in `invitation_email` so a caller can tell "invited" from "invited and
        welcomed" instead of assuming both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role]
              properties:
                email: { type: string, format: email }
                full_name: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '201':
          description: |
            Invited — auth.users + public.users rows created. `invitation_email`
            reports the branded email separately: `sent`, `not-configured`
            (no `RESEND_API_KEY`), `rate-limited` (Resend free tier: 100/day,
            3,000/month, 2/sec) or `failed`. Any value other than `sent` still
            means the account was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
        '400': { description: Invalid email/role, or missing full_name }
        '401': { description: Missing/invalid Authorization header or session }
        '403': { description: Caller is authenticated but not an admin }
        '409': { description: Email is already registered }
        '500': { description: Server misconfigured, or invite succeeded but profile creation failed (still recoverable via the pending-registrations flow) }

  /reject-registration:
    post:
      tags: [functions, admin]
      summary: Reject an unapproved registration (Admin only)
      description: |
        The mirror of `/invite-user` (TAD ADR-039): deletes the pending
        `auth.users` row for `{ id }` via `auth.admin.deleteUser` under
        `SUPABASE_SERVICE_ROLE_KEY`. Same in-code admin check (`authenticateCaller`
        + `public.users.role`), since `auth.users` is not PostgREST-exposed
        and has no RLS layer.

        Refuses with **409** if the id already has a `public.users` row —
        deleting it would cascade away a real profile (`public.users.id
        references auth.users (id) on delete cascade`, migration 002). The
        staged `registration_requests` row (migration 020), if any, is
        removed by its own cascade to `auth.users`; no explicit delete.

        Not a blocklist: nothing stops the same Google account signing in
        again, which re-creates `auth.users` and returns the person to the
        pending list as a fresh entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid, description: The pending auth.users id from fn_pending_registrations }
      responses:
        '200':
          description: Rejected — the auth.users row (and any registration_requests row) is deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '400': { description: Missing id, invalid JSON, or a GoTrue error (e.g. id not found) }
        '401': { description: Missing/invalid Authorization header or session }
        '403': { description: Caller is authenticated but not an admin }
        '409': { description: That id already has a public.users profile and cannot be rejected }
        '500': { description: Server misconfigured, or the profile-existence lookup failed }

  /enrol-from-form:
    post:
      tags: [functions, admin]
      summary: Enrol a family from the Daftar Ulang Google Form (shared-secret channel)
      description: |
        Called by the container-bound Apps Script on the re-registration
        form's response sheet (TAD ADR-043, PRD FR-010). No caller — the
        channel is authenticated with the `ENROL_FORM_SECRET` shared
        secret in the `X-Webhook-Secret` header, the `notify-*` webhook
        shape (`verifyWebhookSecret`, fail-closed, timing-safe). A
        dedicated secret, not `NOTIFY_WEBHOOK_SECRET`.

        Resolves the parent's `auth.users` id — an e-mail lookup on
        `public.users` first (the re-submission path), else
        `auth.admin.createUser({ email, email_confirm: true })` under
        `SUPABASE_SERVICE_ROLE_KEY` — then calls
        `public.fn_enrol_from_form`, which writes the parent profile, the
        student and the guardian link in one transaction (the DEFERRABLE
        guardian invariant from migration 021 needs the student and its
        first guardian in the same transaction; `fn_admin_save_student`
        cannot be reused — it gates on `fn_is_admin()`).

        Matches the student record by this guardian + `lower(trim(name))`
        + `date_of_birth` (→ `updated`), else name + DOB alone
        (→ `needs_attention`, nothing created — a second guardian, or a
        corrected name), else a new student (→ `enrolled`). A repeat
        refreshes names/locale in place, keeps ids, and sends no second
        invitation. A brand-new account gets the branded invitation
        e-mail (ADR-018); a mail failure never fails the enrolment.

        When `student_email` is given it also links or provisions the
        student's own `role=student` self-login and e-mails the student
        (PRD #10, no age gate — ADR-021; the form's required consent tick
        is the guardian's basis). A non-student address or a name
        mismatch → `needs_attention`.

        Every submission — including a validation failure — writes one
        `public.enrolment_submissions` row (admin-read, service-role-write).
        `class_id` is left null (an admin assigns the Grup). The form's
        payment question is neither forwarded nor stored (payment is out
        of Phase 1 scope).

        `fn_enrol_from_form` itself is `service_role`-only (REVOKEd from
        `authenticated`, plus an `auth.role()` guard) and is not a
        PostgREST route the app calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified_email, parent_name, student_name, date_of_birth, consent]
              properties:
                submitted_at: { type: string, format: date-time, description: The form Timestamp; defaults to now if absent }
                verified_email: { type: string, format: email, description: The Google-verified respondent address — the parent identity }
                parent_name: { type: string, maxLength: 120 }
                student_name: { type: string, maxLength: 120 }
                date_of_birth: { type: string, format: date, description: A real, non-future date; YYYY-MM-DD or a locale string }
                locale: { type: string, description: "'Bahasa Indonesia' / 'Nederlands' / 'id' / 'nl'; defaults to id", enum: [id, nl, 'Bahasa Indonesia', 'Nederlands'] }
                relation: { type: string, maxLength: 40, description: Ayah / Ibu / Wali / Lainnya — stored on the guardian link }
                student_email: { type: string, description: "Optional. If given: links the student's existing role=student login (adding this guardian) or, for a new/unregistered address, creates the account and invites the student (PRD #10, no age gate). A non-student address or a name mismatch -> needs_attention. Also stored on the log row." }
                consent: { description: The consent checkbox — required truthy; accepts the option text or a boolean }
      responses:
        '201':
          description: >
            Processed. `status` is `enrolled` (new student created), `updated`
            (an existing student matched — by the child's login e-mail or by
            this guardian + name + DOB — and was refreshed), or `needs_attention`
            (a student with the same name + DOB exists that this submitter
            neither guards nor matched by e-mail; nothing was created, an admin
            links the guardian from Beheer).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [enrolled, updated, needs_attention] }
                  parent_user_id: { type: string, format: uuid, nullable: true }
                  student_id: { type: string, format: uuid, nullable: true, description: null when status is needs_attention }
                  invitation_email: { type: string, nullable: true, description: parent sendEmail result status, or null when no invitation was due }
                  student_invitation_email: { type: string, nullable: true, description: student sendEmail result status, or null when no self-login was provisioned }
        '200': { description: "Processed but a human is needed (status needs_attention) — the verified e-mail already belongs to an auth account that has no profile; supabase-js cannot resolve it, so an admin finishes it from Registrations" }
        '400': { description: Invalid JSON, or a payload that fails validation (bad e-mail, missing name, non-date DOB, consent not given) — still logged as an error row }
        '401': { description: Missing or wrong X-Webhook-Secret }
        '500': { description: ENROL_FORM_SECRET unset, a Supabase env var missing, or the RPC failed }
        '502': { description: Creating the parent auth account failed for a reason other than "already exists" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase session JWT obtained via Google OAuth
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase anon key (public)

  parameters:
    select:
      name: select
      in: query
      schema: { type: string }
      description: 'PostgREST column selection / embedding, e.g. `*,students(*)`'

  responses:
    Unauthorized:
      description: Missing or invalid JWT
    ForbiddenRLS:
      description: RLS policy denied the operation (PostgREST returns 403 or an empty result)

  schemas:
    Notification:
      type: object
      description: |
        One in-app notification: this recipient was told this thing about this
        child on this day. Deliberately carries nothing about presentation —
        no ordering key, no category, no rendered string — so the notification
        centre's design can change without a migration (TAD ADR-017(a)).
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: FK → users.id (the recipient) }
        student_id: { type: string, format: uuid, description: FK → students.id (who it is about) }
        event: { $ref: '#/components/schemas/NotificationEvent' }
        context:
          type: object
          description: >-
            What the in-app copy interpolates beyond the child's name — the
            jilid number, the surah, the assignment title and its due date.
            Scalars only. The child's **name is not here**: it is joined
            through student_id, so a corrected name corrects every past
            notification.
          additionalProperties: { oneOf: [{ type: string }, { type: number }] }
        event_date:
          type: string
          format: date
          description: >-
            The family's own Europe/Amsterdam calendar date, supplied by the
            sender. With user_id, student_id and event it forms the unique key
            — the same tuple as the push dedup tag, which is what makes an
            hourly scheduled Function safe to re-run.
        created_at: { type: string, format: date-time }
        read_at:
          type: string
          format: date-time
          nullable: true
          description: The only column a client may write.
    NotificationEvent:
      type: string
      description: Matches `NOTIFICATION_EVENTS` and the `notification_event` Postgres enum exactly.
      enum:
        - absence
        - newAssignment
        - assignmentDueTomorrow
        - jilidMilestone
        - surahMemorized
        - murajaahReminder
        - reportReady
        - weeklyDigest
    NotifyResult:
      type: object
      description: |
        What every webhook-driven notification Function returns. A skip is
        not an error: the triggering row may have been corrected or deleted,
        the event may not have been a milestone after all, or nobody in the
        family may have notifications enabled.
      properties:
        sent: { type: integer, description: Pushes accepted by the push service }
        expired:
          type: integer
          description: >-
            Subscriptions the push service reported gone (404/410). These are
            cleared from users.push_sub so later sends do not keep burning a
            request on a dead endpoint.
        failed: { type: integer, description: Sends that failed for some other reason }
        skipped:
          type: string
          description: Present instead of a delivery count when nothing was attempted
      # No `tags`. The dedup tag is `{event}:{user_id}:{student_id}:{YYYY-MM-DD}`,
      # so returning the list would disclose two internal identifiers per
      # delivery through a channel whose purpose is to report a number.
      # `reportable()` in `netlify/functions/lib/notifyStudent.ts` strips them
      # from every Function's response — TAD ADR-016(e).
    ScheduledResult:
      allOf:
        - $ref: '#/components/schemas/NotifyResult'
      description: |
        What a Netlify Scheduled Function returns. Identical to `NotifyResult`,
        with two extra `skipped` shapes that are the normal case rather than an
        error — 23 of the 24 daily runs end in the first of them:

        - `{ "skipped": "not 18:00 in Europe/Amsterdam", "hour": 12 }` — the
          local-time gate is closed. The job returns before opening a database
          connection.
        - `{ "skipped": "not the scheduled weekday", "weekday": 4 }` — for the
          Friday digest.
    UserRole:
      type: string
      enum: [admin, tutor, parent, student]
    Locale:
      type: string
      enum: [id, nl]
    AttendanceStatusEnum:
      type: string
      enum: [present, absent, late]
    AssignmentStatusEnum:
      type: string
      enum: [pending, completed, incomplete, partial]
    YanbuahMastery:
      type: string
      enum: [lancar, kurang_lancar, ulang]
    QuranQuality:
      type: string
      enum: [mumtaz, jayyid_jiddan, jayyid, maqbul, perlu_perbaikan]
    MurajaahQuality:
      type: string
      enum: [hafal_lancar, hafal_kurang_lancar, belum_hafal]
    MurajaahFrequency:
      type: string
      enum: [daily, 3x_week, weekly]
    ReportStatus:
      type: string
      enum: [draft, published]
    ReportGrade:
      type: string
      enum: [mumtaz, jayyid_jiddan, jayyid, maqbul, perlu_bimbingan]

    Class:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schedule:
          type: string
          nullable: true
          description: >-
            Free-text time range ("Sabtu 10:00-12:00"). The *days* the group
            meets are `meeting_days`; this field is not parsed.
        meeting_days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: >-
            Weekday(s) the group meets, as `dow` integers — 0=Sunday … 6=Saturday
            (matches Postgres `extract(dow …)` and JS `Date#getDay()`). Non-empty,
            no duplicates (CHECK). Admin-write only. A `sessions` row can only be
            created for a date whose weekday is in this set —
            `trg_sessions_meeting_day` rejects any other INSERT, for every caller
            including admin (TAD ADR-037).
        tutor_ids:
          type: array
          items: { type: string, format: uuid }
          description: >-
            The tutors assigned to this class. This array is the tutor
            relationship — `fn_my_classes()` is `auth.uid() = any (tutor_ids)`,
            and no policy consults `users.role` to decide it (TAD ADR-019).
        created_at: { type: string, format: date-time }

    Student:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          nullable: true
          description: FK → users.id; set only for 16+ students with their own login
        full_name: { type: string }
        class_id: { type: string, format: uuid, nullable: true }
        date_of_birth: { type: string, format: date }
        enrollment_date: { type: string, format: date }
        current_jilid: { type: integer, minimum: 1, maximum: 7 }
        current_surah: { type: integer, minimum: 1, maximum: 114 }
        current_ayah: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
      description: >-
        `parent_id` was removed in migration 021 (TAD ADR-040). A child's
        guardians live in `student_guardians` — see that schema — and a child
        may have more than one.

    StudentGuardian:
      type: object
      description: >-
        A link between a child and a guardian account (migration 021, ADR-040).
        Symmetric — no "primary". A child always has ≥1 row with
        `unlinked_at IS NULL` (enforced by trigger). A removed link keeps its
        row with `unlinked_at` set, for audit. RLS: a guardian reads their own
        active links; a tutor reads the active links of students in their
        classes; writes are admin-only.
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid, description: FK → students.id }
        user_id: { type: string, format: uuid, description: FK → users.id }
        relation:
          type: string
          nullable: true
          description: Free-text label ("moeder", "vader", "voogd"); shown in the admin UI, read by no policy
        created_at: { type: string, format: date-time }
        unlinked_at:
          type: string
          format: date-time
          nullable: true
          description: NULL while active; set when an admin removes the link

    RegistrationRequest:
      type: object
      description: A pre-approval submission (migration 020, TAD ADR-038).
      properties:
        id: { type: string, format: uuid, description: 'PK, = auth.users.id (the caller''s own)' }
        full_name: { type: string, minLength: 1, maxLength: 120 }
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Free-text context for the admin; who they are / which child / why.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegistrationRequestWrite:
      type: object
      required: [id, full_name]
      properties:
        id: { type: string, format: uuid, description: Must be the caller's own id }
        full_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 2000 }

    Attendance:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatusEnum' }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AttendanceInsert:
      type: object
      required: [session_id, student_id, status]
      properties:
        session_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatusEnum' }
        reason: { type: string }
    TutorAttendance:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatusEnum' }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    TutorAttendanceInsert:
      type: object
      required: [session_id, tutor_id, status]
      properties:
        session_id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AttendanceStatusEnum' }
        reason: { type: string }

    UserRoleChange:
      type: object
      description: >-
        One role change applied through `fn_admin_update_user` (TAD ADR-042).
        Admin-only read; written only by the RPC. A name-only edit produces
        no row.
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        old_role: { $ref: '#/components/schemas/UserRole' }
        new_role: { $ref: '#/components/schemas/UserRole' }
        changed_by:
          type: string
          format: uuid
          description: The admin who made the change (`auth.uid()` at the time).
        changed_at: { type: string, format: date-time }

    Assignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        due_date: { type: string, format: date }
        created_at: { type: string, format: date-time }
    AssignmentInsert:
      type: object
      required: [class_id, title, due_date]
      properties:
        class_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        due_date: { type: string, format: date }
    AssignmentStatus:
      type: object
      description: |
        No 'overdue' value exists on `AssignmentStatusEnum` — it's a
        read-side derived state (status still 'pending' past the parent
        assignment's due_date), computed client-side, not stored.
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssignmentStatusEnum' }
        notes: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    AssignmentStatusInsert:
      type: object
      required: [assignment_id, student_id]
      properties:
        assignment_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssignmentStatusEnum' }

    YanbuaProgress:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        jilid: { type: integer, minimum: 1, maximum: 7 }
        page: { type: integer, minimum: 1 }
        mastery: { $ref: '#/components/schemas/YanbuahMastery' }
        notes: { type: string, nullable: true }
        recorded_at: { type: string, format: date-time }
    YanbuaProgressInsert:
      type: object
      required: [student_id, jilid, page, mastery]
      properties:
        student_id: { type: string, format: uuid }
        jilid: { type: integer, minimum: 1, maximum: 7 }
        page: { type: integer, minimum: 1 }
        mastery: { $ref: '#/components/schemas/YanbuahMastery' }
        notes: { type: string }

    QuranProgress:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        surah_num: { type: integer, minimum: 1, maximum: 114 }
        ayah_from: { type: integer, minimum: 1 }
        ayah_to: { type: integer, minimum: 1 }
        quality: { $ref: '#/components/schemas/QuranQuality' }
        tajweed_notes: { type: string, nullable: true }
        recorded_at: { type: string, format: date-time }
    QuranProgressInsert:
      type: object
      required: [student_id, surah_num, ayah_from, ayah_to, quality]
      properties:
        student_id: { type: string, format: uuid }
        surah_num: { type: integer, minimum: 1, maximum: 114 }
        ayah_from: { type: integer, minimum: 1 }
        ayah_to: { type: integer, minimum: 1 }
        quality: { $ref: '#/components/schemas/QuranQuality' }
        tajweed_notes: { type: string }

    MurajaahAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        surah_num: { type: integer, minimum: 1, maximum: 114 }
        ayah_from: { type: integer, minimum: 1 }
        ayah_to: { type: integer, minimum: 1 }
        frequency: { $ref: '#/components/schemas/MurajaahFrequency' }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    MurajaahAssignmentInsert:
      type: object
      required: [student_id, surah_num, ayah_from, ayah_to, frequency]
      properties:
        student_id: { type: string, format: uuid }
        surah_num: { type: integer, minimum: 1, maximum: 114 }
        ayah_from: { type: integer, minimum: 1 }
        ayah_to: { type: integer, minimum: 1 }
        frequency: { $ref: '#/components/schemas/MurajaahFrequency' }

    MurajaahLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        confirmed_by: { type: string, format: uuid, description: FK → users.id (parent) }
        quality: { $ref: '#/components/schemas/MurajaahQuality' }
        date: { type: string, format: date }
        created_at: { type: string, format: date-time }
    MurajaahLogInsert:
      type: object
      required: [assignment_id, quality, date]
      properties:
        assignment_id: { type: string, format: uuid }
        quality: { $ref: '#/components/schemas/MurajaahQuality' }
        date: { type: string, format: date }

    YearEndReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        academic_year: { type: string, example: '2025/2026' }
        tutor_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReportStatus' }
        narrative: { type: string, nullable: true }
        yanbua_grade: { $ref: '#/components/schemas/ReportGrade' }
        yanbua_notes: { type: string, nullable: true }
        quran_grade: { $ref: '#/components/schemas/ReportGrade' }
        quran_notes: { type: string, nullable: true }
        murajaah_grade: { $ref: '#/components/schemas/ReportGrade' }
        murajaah_notes: { type: string, nullable: true }
        overall_grade:
          allOf: [{ $ref: '#/components/schemas/ReportGrade' }]
          nullable: true
        attendance_present: { type: integer, readOnly: true }
        attendance_absent: { type: integer, readOnly: true }
        attendance_late: { type: integer, readOnly: true }
        attendance_rate: { type: number, format: float, readOnly: true, description: Percentage, e.g. 92.31 }
        pdf_path: { type: string, nullable: true, readOnly: true }
        generated_at: { type: string, format: date-time, readOnly: true }
        published_at: { type: string, format: date-time, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    YearEndReportUpdate:
      type: object
      description: Only tutor-authored fields are editable via PATCH; stats and status are managed server-side.
      properties:
        narrative: { type: string }
        yanbua_grade: { $ref: '#/components/schemas/ReportGrade' }
        yanbua_notes: { type: string }
        quran_grade: { $ref: '#/components/schemas/ReportGrade' }
        quran_notes: { type: string }
        murajaah_grade: { $ref: '#/components/schemas/ReportGrade' }
        murajaah_notes: { type: string }
        overall_grade: { $ref: '#/components/schemas/ReportGrade' }
